# VassilFlow Development Environment
# Usage: docker-compose -f docker-compose-dev.yaml up --build
#
# Services:
#   - nginx: Reverse proxy (port 2026)
#   - frontend: Frontend Next.js dev server (port 3000)
#   - gateway: Backend Gateway API + agent runtime (port 8001)
#   - office-renderer: Isolated DOCX page renderer
#   - office-renderer-proxy: One-way renderer bridge (host loopback port 8003)
#   - provisioner (optional): Sandbox provisioner (creates Pods in host Kubernetes)
#
# Prerequisites:
#   - Kubernetes cluster + kubeconfig are only required when using provisioner mode.
#
# Access: http://localhost:2026

services:
  # Isolated Office renderer. Only the fixed-route proxy shares its private
  # network, so renderer code has no route back to the Gateway.
  office-renderer:
    build:
      context: ./office-renderer
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: vassilflow-office-renderer
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=768m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    networks:
      - vassilflow-office
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=8)"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s

  office-renderer-proxy:
    image: nginx:alpine
    container_name: vassilflow-office-renderer-proxy
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;", "-c", "/etc/nginx/nginx.conf"]
    ports:
      - "127.0.0.1:${VASSILFLOW_OFFICE_RENDERER_PORT:-8003}:8004"
    volumes:
      - ./office-renderer/proxy.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    depends_on:
      office-renderer:
        condition: service_healthy
    networks:
      - vassilflow-office
      - vassilflow-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Sandbox Provisioner ────────────────────────────────────────────────
  # Manages per-sandbox Pod + Service lifecycle in the host Kubernetes
  # cluster via the K8s API.
  # Backend accesses sandboxes directly via host.docker.internal:{NodePort}.
  provisioner:
    build:
      context: ./provisioner
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
    container_name: vassilflow-provisioner
    volumes:
      - ~/.kube/config:/root/.kube/config:ro
    environment:
      - K8S_NAMESPACE=${VASSILFLOW_K8S_NAMESPACE:-vassilflow}
      - SANDBOX_APP_LABEL=${VASSILFLOW_SANDBOX_APP_LABEL:-vassilflow-sandbox}
      - SANDBOX_APP_NAME_LABEL=${VASSILFLOW_SANDBOX_APP_NAME_LABEL:-vassilflow}
      - USERDATA_PVC_SUBPATH_ROOT=${VASSILFLOW_USERDATA_PVC_SUBPATH_ROOT:-vassilflow}
      - SANDBOX_IMAGE=enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest
      - SANDBOX_CONTAINER_PORT=${VASSILFLOW_SANDBOX_CONTAINER_PORT:-8080}
      # Host paths for K8s HostPath volumes (must be absolute paths accessible by K8s node)
      # On Docker Desktop/OrbStack, use your actual host paths like /Users/username/...
      # Set these in your shell before running docker-compose:
      #   export VASSILFLOW_ROOT=/absolute/path/to/VassilFlow
      - SKILLS_HOST_PATH=${VASSILFLOW_ROOT:-..}/skills
      - THREADS_HOST_PATH=${VASSILFLOW_RUNTIME_HOME:-${VASSILFLOW_ROOT:-..}/backend/.vassilflow}/threads
      # Production: use PVC instead of hostPath to avoid data loss on node failure.
      # When set, hostPath vars above are ignored for the corresponding volume.
      # USERDATA_PVC_NAME uses subPath (vassilflow/users/{user_id}/threads/{thread_id}/user-data) automatically.
      # - SKILLS_PVC_NAME=vassilflow-skills-pvc
      # - USERDATA_PVC_NAME=vassilflow-userdata-pvc
      - KUBECONFIG_PATH=/root/.kube/config
      - NODE_HOST=host.docker.internal
      # Override K8S API server URL since kubeconfig uses 127.0.0.1
      # which is unreachable from inside the container
      - K8S_API_SERVER=https://host.docker.internal:26443
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vassilflow-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ── Reverse Proxy ──────────────────────────────────────────────────────
  # Routes API traffic to gateway and (optionally) provisioner.
  nginx:
    image: nginx:alpine
    container_name: vassilflow-nginx
    ports:
      - "2026:2026"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
    command:
      - sh
      - -c
      - |
        set -e
        cp /etc/nginx/nginx.conf.template /etc/nginx/nginx.conf
        test -e /proc/net/if_inet6 || sed -i '/^[[:space:]]*listen[[:space:]]\+\[::\]:2026;/d' /etc/nginx/nginx.conf
        exec nginx -g 'daemon off;'
    depends_on:
      - frontend
      - gateway
    networks:
      - vassilflow-dev
    restart: unless-stopped

  # Frontend - Next.js Development Server
  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      target: dev
      args:
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: vassilflow-frontend
    command: sh -c "cd frontend && pnpm run dev > /app/logs/frontend.log 2>&1"
    volumes:
      - ../frontend/src:/app/frontend/src
      - ../frontend/public:/app/frontend/public
      - ../frontend/next.config.js:/app/frontend/next.config.js:ro
      - ../logs:/app/logs
      # Mount pnpm store for caching
      - ${PNPM_STORE_PATH:-~/.local/share/pnpm/store}:/root/.local/share/pnpm/store
    working_dir: /app
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CI=true
      - VASSILFLOW_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
    env_file:
      - ../frontend/.env
    networks:
      - vassilflow-dev
    restart: unless-stopped

  # Backend - Gateway API
  gateway:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      target: dev
      # cache_from disabled - requires manual setup: mkdir -p /tmp/docker-cache-gateway
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
    container_name: vassilflow-gateway
    # Startup logic lives in docker/dev-entrypoint.sh — UV_EXTRAS validation,
    # `uv sync --all-packages`, .venv self-heal, and uvicorn handoff. Keeps
    # this file readable and lets the script be linted (shellcheck-clean).
    # See PR #2767 / Issue #2754.
    command: ["sh", "/usr/local/bin/dev-entrypoint.sh"]
    volumes:
      # Mount the dev entrypoint as a read-only file so edits to the script
      # take effect on `make docker-restart` without requiring an image rebuild.
      - ./dev-entrypoint.sh:/usr/local/bin/dev-entrypoint.sh:ro
      - ../backend/:/app/backend/
      # Preserve the .venv built during Docker image build — mounting the full backend/
      # directory above would otherwise shadow it with the (empty) host directory.
      - gateway-venv:/app/backend/.venv
      # Mount the project directory instead of mutable config files individually.
      # Host editors commonly replace files on save; a directory bind keeps those
      # replacements visible inside Docker Desktop/WSL containers.
      - ../:/app/project
      - ../skills:/app/skills
      - ../logs:/app/logs
      # Use a Docker-managed uv cache volume instead of a host bind mount.
      # On macOS/Docker Desktop, uv may fail to create symlinks inside shared
      # host directories, which causes startup-time `uv sync` to crash.
      - gateway-uv-cache:/root/.cache/uv
      # DooD: the host Docker socket is NOT mounted by default. It is added only
      # for aio (pure-DooD) sandbox mode via the opt-in docker-compose.dood.yaml
      # overlay (appended by scripts/docker.sh). See backend/docs/CONFIGURATION.md 
      
      # CLI auth dirs (Claude Code / Codex) are NOT mounted by default: they
      # expose the entire ~/.claude and ~/.codex (history, projects, global
      # config, credentials) into the container. Mount them only when you use
      # the Claude/Codex CLI login as a model provider or ACP agent, via the
      # opt-in docker-compose.cli-auth.yaml overlay. Prefer an env token
      # (CLAUDE_CODE_OAUTH_TOKEN, see .env.example / backend/docs/CONFIGURATION.md).
    working_dir: /app
    depends_on:
      office-renderer-proxy:
        condition: service_healthy
    environment:
      - CI=true
      - VASSILFLOW_PROJECT_ROOT=/app
      - VASSILFLOW_HOME=${VASSILFLOW_CONTAINER_HOME:-/app/backend/.vassilflow}
      - VASSILFLOW_CONFIG_PATH=/app/project/config.yaml
      - VASSILFLOW_EXTENSIONS_CONFIG_PATH=/app/project/extensions_config.json
      - VASSILFLOW_CHANNELS_LANGGRAPH_URL=${VASSILFLOW_CHANNELS_LANGGRAPH_URL:-http://gateway:8001/api}
      - VASSILFLOW_CHANNELS_GATEWAY_URL=${VASSILFLOW_CHANNELS_GATEWAY_URL:-http://gateway:8001}
      - VASSILFLOW_INTERNAL_AUTH_TOKEN=${VASSILFLOW_INTERNAL_AUTH_TOKEN:-}
      - VASSILFLOW_HOST_BASE_DIR=${VASSILFLOW_RUNTIME_HOME:-${VASSILFLOW_ROOT:-..}/backend/.vassilflow}
      - VASSILFLOW_HOST_SKILLS_PATH=${VASSILFLOW_ROOT:-..}/skills
      - VASSILFLOW_SANDBOX_HOST=host.docker.internal
      - VASSILFLOW_OFFICE_RENDERER_URL=http://office-renderer-proxy:8004
      # Proxy values (HTTP_PROXY/HTTPS_PROXY/ALL_PROXY) are inherited from ../.env via env_file.
      # Only NO_PROXY is declared here so internal service hostnames are always exempt from the proxy.
      - NO_PROXY=${NO_PROXY:-}${NO_PROXY:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,provisioner,office-renderer-proxy,host.docker.internal
      - no_proxy=${no_proxy:-}${no_proxy:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,provisioner,office-renderer-proxy,host.docker.internal
    env_file:
      - ../.env
    extra_hosts:
      # For Linux: map host.docker.internal to host gateway
      - "host.docker.internal:host-gateway"
    networks:
      - vassilflow-dev
    restart: unless-stopped

volumes:
  # Persist .venv across container restarts so dependencies installed during
  # image build are not shadowed by the host backend/ directory mount.
  gateway-venv:
  gateway-uv-cache:

networks:
  vassilflow-dev:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24
  vassilflow-office:
    driver: bridge
    internal: true
