# VassilFlow Production Environment
# Usage: make up
#
# Services:
#   - nginx:       Reverse proxy (port 2026, configurable via PORT env var)
#   - frontend:    Next.js production server
#   - gateway:     FastAPI Gateway API + agent runtime
#   - provisioner: (optional) Sandbox provisioner for Kubernetes mode
#
# Key environment variables (set via environment/.env or scripts/deploy.sh):
#   VASSILFLOW_PROJECT_ROOT          — project root for relative runtime paths
#   VASSILFLOW_HOME                  — runtime data dir, default .vassilflow under $VASSILFLOW_PROJECT_ROOT (or cwd)
#   VASSILFLOW_CONFIG_PATH           — path to config.yaml
#   VASSILFLOW_EXTENSIONS_CONFIG_PATH — path to extensions_config.json
#   VASSILFLOW_SKILLS_PATH           — skills dir, default $VASSILFLOW_PROJECT_ROOT/skills
#   VASSILFLOW_DOCKER_SOCKET         — Docker socket path for aio/DooD mode, default /var/run/docker.sock (used only by the opt-in docker-compose.dood.yaml overlay)
#   VASSILFLOW_REPO_ROOT             — repo root (used for skills host path in DooD)
#   BETTER_AUTH_SECRET               — required for frontend auth/session security
#   VASSILFLOW_INTERNAL_AUTH_TOKEN   — shared internal Gateway auth token for multi-worker IM channels
#
# LangSmith tracing is disabled by default (LANGSMITH_TRACING=false).
# Set LANGSMITH_TRACING=true and LANGSMITH_API_KEY in .env to enable it.
#
# Access: http://localhost:${PORT:-2026}

services:
  # ── Reverse Proxy ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: vassilflow-nginx
    ports:
      - "${PORT:-2026}:2026"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
    command: >
      sh -c "cp /etc/nginx/nginx.conf.template /etc/nginx/nginx.conf
      && nginx -g 'daemon off;'"
    depends_on:
      - frontend
      - gateway
    networks:
      - vassilflow
    restart: unless-stopped

  # ── Frontend: Next.js Production ───────────────────────────────────────────
  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: vassilflow-frontend
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - VASSILFLOW_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
    env_file:
      - ../frontend/.env
    networks:
      - vassilflow
    restart: unless-stopped

  # ── Gateway API ────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
        UV_EXTRAS: ${UV_EXTRAS:-}
    container_name: vassilflow-gateway
    # Gateway hosts the agent runtime with in-process RunManager + StreamBridge
    # singletons -- run state lives in this worker's memory. Default to a single
    # worker: with >1 worker and no nginx sticky sessions, run cancel, SSE
    # reconnect, request dedup, and per-worker IM channel services all break
    # across workers until a shared (e.g. redis) stream bridge lands, which is
    # not yet implemented. Startup rejects GATEWAY_WORKERS values other than 1.
    command: sh -c "cd backend && PYTHONPATH=. uv run uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --workers ${GATEWAY_WORKERS:-1}"
    volumes:
      - ${VASSILFLOW_CONFIG_PATH:-../config.yaml}:/app/backend/config.yaml:ro
      - ${VASSILFLOW_EXTENSIONS_CONFIG_PATH:-../extensions_config.json}:/app/backend/extensions_config.json:ro
      - ../skills:/app/skills:ro
      - ${VASSILFLOW_HOME:-../backend/.vassilflow}:/app/backend/.vassilflow
      # DooD: the host Docker socket is NOT mounted by default. It is added only
      # for aio (pure-DooD) sandbox mode via the opt-in docker-compose.dood.yaml
      # overlay (appended by scripts/deploy.sh). See backend/docs/CONFIGURATION.md
      # Security Note section for details.
       
      # CLI auth dirs (Claude Code / Codex) are NOT mounted by default: they
      # expose the entire ~/.claude and ~/.codex (history, projects, global
      # config, credentials) into the container. Mount them only when you use
      # the Claude/Codex CLI login as a model provider or ACP agent, via the
      # opt-in docker-compose.cli-auth.yaml overlay. Prefer an env token
      # (CLAUDE_CODE_OAUTH_TOKEN, see .env.example / backend/docs/CONFIGURATION.md).
    working_dir: /app
    environment:
      - CI=true
      # Forward the CLI count so the runtime startup guard sees Compose overrides.
      - GATEWAY_WORKERS=${GATEWAY_WORKERS:-1}
      - VASSILFLOW_PROJECT_ROOT=/app
      - VASSILFLOW_HOME=/app/backend/.vassilflow
      - VASSILFLOW_CONFIG_PATH=/app/backend/config.yaml
      - VASSILFLOW_EXTENSIONS_CONFIG_PATH=/app/backend/extensions_config.json
      - VASSILFLOW_CHANNELS_LANGGRAPH_URL=${VASSILFLOW_CHANNELS_LANGGRAPH_URL:-http://gateway:8001/api}
      - VASSILFLOW_CHANNELS_GATEWAY_URL=${VASSILFLOW_CHANNELS_GATEWAY_URL:-http://gateway:8001}
      - VASSILFLOW_INTERNAL_AUTH_TOKEN=${VASSILFLOW_INTERNAL_AUTH_TOKEN:-}
      - VASSILFLOW_HOST_BASE_DIR=${VASSILFLOW_HOME:-../backend/.vassilflow}
      - VASSILFLOW_HOST_SKILLS_PATH=${VASSILFLOW_REPO_ROOT:-..}/skills
      - VASSILFLOW_SANDBOX_HOST=host.docker.internal
      # Proxy values (HTTP_PROXY/HTTPS_PROXY/ALL_PROXY) are inherited from ../.env via env_file.
      # Only NO_PROXY is declared here so internal service hostnames are always exempt from the proxy.
      - NO_PROXY=${NO_PROXY:-}${NO_PROXY:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,provisioner,host.docker.internal
      - no_proxy=${no_proxy:-}${no_proxy:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,provisioner,host.docker.internal
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vassilflow
    restart: unless-stopped

  # ── Sandbox Provisioner (optional, Kubernetes mode) ────────────────────────
  provisioner:
    build:
      context: ./provisioner
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: vassilflow-provisioner
    volumes:
      - ~/.kube/config:/root/.kube/config:ro
    environment:
      - K8S_NAMESPACE=${VASSILFLOW_K8S_NAMESPACE:-vassilflow}
      - SANDBOX_APP_LABEL=${VASSILFLOW_SANDBOX_APP_LABEL:-vassilflow-sandbox}
      - SANDBOX_APP_NAME_LABEL=${VASSILFLOW_SANDBOX_APP_NAME_LABEL:-vassilflow}
      - USERDATA_PVC_SUBPATH_ROOT=${VASSILFLOW_USERDATA_PVC_SUBPATH_ROOT:-vassilflow}
      - SANDBOX_IMAGE=enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest
      - SANDBOX_CONTAINER_PORT=${VASSILFLOW_SANDBOX_CONTAINER_PORT:-8080}
      - SKILLS_HOST_PATH=${VASSILFLOW_REPO_ROOT:-..}/skills
      - THREADS_HOST_PATH=${VASSILFLOW_HOME:-../backend/.vassilflow}/threads
      - KUBECONFIG_PATH=/root/.kube/config
      - NODE_HOST=host.docker.internal
      - K8S_API_SERVER=https://host.docker.internal:26443
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vassilflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6
networks:
  vassilflow:
    driver: bridge
