worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    access_log off;
    client_max_body_size 50m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    upstream office_renderer_backend {
        server office-renderer:8003;
        keepalive 2;
    }

    server {
        listen 8004;
        server_name _;

        location = /health {
            proxy_pass http://office_renderer_backend/health;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location = /v1/render/docx {
            limit_except POST { deny all; }
            proxy_pass http://office_renderer_backend;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            proxy_connect_timeout 5s;
            proxy_send_timeout 35s;
            proxy_read_timeout 130s;
        }

        location = /v1/render/xlsx {
            limit_except POST { deny all; }
            proxy_pass http://office_renderer_backend;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            proxy_connect_timeout 5s;
            proxy_send_timeout 35s;
            proxy_read_timeout 130s;
        }

        location = /v1/render/pptx {
            limit_except POST { deny all; }
            proxy_pass http://office_renderer_backend;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            proxy_connect_timeout 5s;
            proxy_send_timeout 35s;
            proxy_read_timeout 130s;
        }

        location / {
            return 404;
        }
    }
}
