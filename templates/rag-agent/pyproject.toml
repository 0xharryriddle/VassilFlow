[project]
name = "domain-assistant"
version = "0.1.1"
description = "Reusable RAG and delegated-agent project starter"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["vassilflow-core>=0.1.1,<0.2.0"]

[project.optional-dependencies]
openai = ["langchain-openai>=1.2.1,<2"]
dev = ["pytest>=8,<10"]

[project.scripts]
rag-agent = "domain_assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domain_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
